# General config
set -g mouse on
set -g default-terminal "tmux-256color"
setw -g mode-keys vi
set -g escape-time 0
set -g renumber-windows on

# Keys
unbind C-b
set-option -g prefix C-a
bind-key C-a last-window

# Window split configs
unbind \"
unbind %
bind n new-window -c "#{pane_current_path}"
bind c kill-pane # Match Vim window shortcut.
bind v split-window -h -c "#{pane_current_path}"
bind s split-window -v -c "#{pane_current_path}"
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
set -g pane-border-style "fg=WebGray bg=default dim"
set -g pane-active-border-style "fg=white bg=default"

# Status line config
set-window-option -g window-status-format "#[dim]#I:#W#F"
set-window-option -g window-status-current-format "#I:#W#F"
set-option -g status-style bg=default
set-option -g status-left-length 50
set -g status-fg white
set -g status-left "#[dim]#S | "
set -g status-right "#[dim] | %a %b %d %H:%M"
set -g message-style "fg=white bg=default bold"

# Popup terminal.
unbind t
bind t display-popup -E -T " Terminal " -w 150 -h 40

# Fuzzy file finder. Passes through selected file either to vim with the :edit command directly or
# starts a new vim instance with that path.
unbind f
bind f display-popup -E -T " Find " -w 150 -h 40 bash -c "\
file=$(fzf --layout=reverse --preview=\"bat -n --decorations=always --color=always {}\" --bind=ctrl-j:preview-down,ctrl-k:preview-up,ctrl-d:preview-half-page-down,ctrl-u:preview-half-page-up); \
if [[ $(tmux display -p \"#{pane_current_command}\") == \"vim\" ]]; then \
    tmux send-keys \":e \$file \r\"; \
else \
    tmux send-keys \"vim \$file \r\"; \
fi"

# Find directories and cd into them.
unbind d
bind d display-popup -E -T " Directories " -w 150 -h 40 bash -c "\
dir=$(find . -type d | fzf --layout=reverse --preview=\"tree -L1 -a --gitignore --noreport -C {}\" --bind=ctrl-j:preview-down,ctrl-k:preview-up,ctrl-d:preview-half-page-down,ctrl-u:preview-half-page-up); \
if [[ $(tmux display -p \"#{pane_current_command}\") == \"vim\" ]]; then \
    tmux send-keys \":cd \$dir \r\"; \
else \
    tmux send-keys \"cd \$dir \r\"; \
fi"

# Launches tig in a popup window.
unbind g
bind g display-popup -E -T " Git " -w 150 -h 40 tig

# Process explorer.
unbind p
bind p display-popup -E -T " Processes " -w 150 -h 40 bash -c "ps -ef | fzf --header-lines=1 --layout=reverse"

# App launcher.
unbind a
bind a display-popup -E -T " Launcher " -w 150 -h 40 bash -c "compgen -c | fzf --layout=reverse | xargs -I{} bash -c \"eval {}\""

